<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10111a" />
  <title>Studio — Visual Website Builder</title>
  <meta name="description" content="Local-first visual website builder with Firebase Auth, Cloud Firestore, Firebase Storage sync, and a community template library." />
  <meta property="og:title" content="Studio — Visual Website Builder" />
  <meta property="og:description" content="Local-first visual website builder with Firebase Auth, Cloud Firestore, Firebase Storage sync, and a community template library." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Projects"><span class="brand-mark">S</span><span class="brand-name">studio</span></button>
      <button class="project-title" id="renameButton" title="Rename project"><span id="projectName">Untitled site</span><span class="edit-mark">✎</span></button>
      <button class="sync-indicator" id="syncStatusButton" type="button" data-sync-state="local-only" title="Synchronization status" aria-live="polite">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="syncStatusText">Local only</span>
      </button>
      <div class="top-actions">
        <button class="icon-button" id="undoButton" aria-label="Undo" title="Undo">↶</button>
        <button class="icon-button" id="redoButton" aria-label="Redo" title="Redo">↷</button>
        <button class="icon-button" id="previewButton" aria-label="Preview" title="Preview">▷</button>
        <button class="icon-button" id="saveButton" aria-label="Save" title="Save">✓</button>
        <button class="icon-button" id="exportButton" aria-label="Export" title="Export">⇩</button>
        <button class="auth-button" id="authButton" type="button" aria-label="Account and sign in">
          <span class="auth-avatar" id="authAvatar" aria-hidden="true">?</span>
          <span class="auth-label" id="authButtonLabel">Sign in</span>
        </button>
        <button class="icon-button" id="moreButton" aria-label="More options" title="More options">•••</button>
      </div>
    </header>
    <main class="workspace">
      <aside class="left-rail" aria-label="Editor tools">
        <button class="rail-item active" data-panel="canvas"><span>▣</span>Canvas</button>
        <button class="rail-item" data-panel="elements"><span>＋</span>Elements</button>
        <button class="rail-item" data-panel="layers"><span>☷</span>Layers</button>
        <button class="rail-item" data-panel="styles"><span>◉</span>Styles</button>
        <button class="rail-item" data-panel="templates"><span>◈</span>Templates</button>
        <button class="rail-item" data-panel="code"><span>&lt;/&gt;</span>Code</button>
      </aside>
      <section class="side-panel" id="sidePanel">
        <div class="panel-heading"><div><span class="eyebrow" id="panelEyebrow">WORKSPACE</span><h2 id="panelTitle">Canvas</h2></div><button id="closePanel" class="small-icon" aria-label="Close panel">×</button></div>
        <div id="panelContent" class="panel-content"></div>
      </section>
      <section class="canvas-area" id="canvasArea">
        <div class="canvas-toolbar">
          <div class="canvas-label"><span class="live-dot"></span><span id="canvasModeLabel">Live canvas</span></div>
          <div class="viewport-switch" role="group" aria-label="Preview width">
            <button class="viewport-button active" data-width="375" title="Mobile" aria-label="Mobile preview width">▯</button>
            <button class="viewport-button" data-width="768" title="Tablet" aria-label="Tablet preview width">▭</button>
            <button class="viewport-button" data-width="1100" title="Desktop" aria-label="Desktop preview width">▱</button>
          </div>
          <button class="small-icon" id="fullscreenButton" title="Full screen preview" aria-label="Full screen preview">⛶</button>
          <button class="small-icon secret-ai-trigger" id="secretAiButton" title="Secret AI (Ctrl/Cmd+Shift+K)" aria-label="Secret AI assistant">✦</button>
        </div>
        <div class="canvas-viewport" id="canvasViewport">
          <div class="page-canvas" id="pageCanvas" aria-label="Website canvas"></div>
        </div>
        <div class="canvas-hint" id="canvasHint">Select an element to edit · Drag layers to reorder · Ctrl/Cmd+C/V to copy/paste · Esc to clear selection</div>
      </section>
      <aside class="right-panel" id="rightPanel">
        <div class="panel-heading"><div><span class="eyebrow">DESIGN</span><h2 id="inspectorTitle">Page settings</h2></div><button id="inspectorCollapse" class="small-icon" aria-label="Collapse inspector">⌄</button></div>
        <div class="inspector-content" id="inspectorContent"></div>
      </aside>
    </main>
    <nav class="mobile-dock" aria-label="Editor navigation">
      <button class="dock-item active" data-panel="canvas"><span>▣</span>Canvas</button>
      <button class="dock-item" data-panel="elements"><span>＋</span>Elements</button>
      <button class="dock-item" data-panel="layers"><span>☷</span>Layers</button>
      <button class="dock-item" data-panel="styles"><span>◉</span>Styles</button>
      <button class="dock-item" data-panel="templates"><span>◈</span>Templates</button>
      <button class="dock-item" data-panel="code"><span>&lt;/&gt;</span>Code</button>
    </nav>
  </div>
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><div><span class="eyebrow" id="modalEyebrow">PROJECTS</span><h2 id="modalTitle">Your projects</h2></div><button class="small-icon" id="modalClose" aria-label="Close">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>
  <input type="file" id="importFile" accept=".json,.html,.htm,application/json,text/html" hidden />
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/script.js"></script>
</body>
</html>
